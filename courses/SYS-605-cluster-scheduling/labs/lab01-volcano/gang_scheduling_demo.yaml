apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: gang-demo
spec:
  minAvailable: 2
  schedulerName: volcano
  queue: default
  tasks:
    - replicas: 2
      name: worker
      template:
        spec:
          containers:
            - name: main
              image: busybox:1.36
              command: ["sleep", "3600"]
          restartPolicy: Never
