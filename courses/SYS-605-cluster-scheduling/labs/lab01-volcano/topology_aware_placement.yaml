# Example: node affinity / topology hints (illustrative — edit for your cluster)
apiVersion: v1
kind: Pod
metadata:
  name: topo-demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: accelerator
                operator: In
                values:
                  - nvidia-tesla-a100
  containers:
    - name: sleep
      image: busybox:1.36
      command: ["sleep", "3600"]
